<!doctype html><html lang="cy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adolygiad Cymraeg Cian</title><style>
body{font:17px Arial,sans-serif;margin:0;background:#fff;color:#000}main{max-width:760px;margin:auto;padding:48px 24px}.card{background:#fff;border:2px solid #000;padding:28px;margin-top:24px}h1{font-size:2rem}.text{font-size:1.55rem;line-height:1.45;margin:30px 0}.muted{color:#000}button{display:block;width:100%;margin:10px 0;padding:15px;border:2px solid #000;border-radius:0;color:#000;font-size:1rem;font-weight:700;cursor:pointer}.yes{background:#63e6be}.no{background:#ff8787}.review{background:#ffd43b}.done{color:#000}
</style></head><body><main><h1>Adolygiad Cymraeg Cian</h1><p class="muted">Aseswch ddefnydd y defnyddiwr, nid gallu'r system. Nid yw ateb y dilysydd yn cael ei ddangos.</p><div id="app" class="card">Yn llwytho…</div></main><script>
let cases=[],i=0;const app=document.querySelector('#app');
function render(){while(i<cases.length&&cases[i].completed)i++;if(i>=cases.length){app.innerHTML='<h2 class="done">Wedi gorffen</h2><p>Mae pob achos wedi’i gofnodi. Gallwch gau’r ffenestr hon.</p>';return}const c=cases[i];app.innerHTML=`<div class="muted">Achos ${i+1} o ${cases.length} · ${c.category}</div><div class="text"></div><button class="yes">CYMRAEG — QUALIFIES</button><button class="no">DIM DEFNYDD CYMRAEG — DOES_NOT_QUALIFY</button><button class="review">ANSICR — REVIEW_REQUIRED</button>`;app.querySelector('.text').textContent=c.text;app.querySelector('.yes').onclick=()=>save('QUALIFIES');app.querySelector('.no').onclick=()=>save('DOES_NOT_QUALIFY');app.querySelector('.review').onclick=()=>save('REVIEW_REQUIRED')}
async function save(decision){for(const b of app.querySelectorAll('button'))b.disabled=true;const r=await fetch('/v0.1/reviews',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({case_id:cases[i].case_id,decision})});if(!r.ok){app.innerHTML='<p>Gwall wrth gadw. Ail-lwythwch y dudalen.</p>';return}cases[i].completed=true;i++;render()}
fetch('/v0.1/review-cases').then(r=>r.json()).then(x=>{cases=x.cases;render()}).catch(()=>app.textContent='Methu cysylltu â’r gwasanaeth adolygu.');
</script></body></html>
