name: Bug report
description: Report a reproducible defect without secrets or personal data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, personal conversation content or unpatched vulnerability details. Use SECURITY.md for vulnerabilities.
  - type: input
    id: version
    attributes: { label: Version or commit, placeholder: 0.1.0-alpha.x or commit SHA }
    validations: { required: true }
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Registry, Language proof, Conversation/session, Validator, Governance, Compute pool, SDK, Documentation, Other]
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Minimal reproduction, description: Use synthetic data only. }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected and actual behavior }
    validations: { required: true }
  - type: checkboxes
    id: hygiene
    attributes:
      label: Data hygiene
      options:
        - label: I removed credentials, personal data and private review records.
          required: true
        - label: This is not a vulnerability requiring private disclosure.
          required: true
